<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock In / Out Report</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #1f2328;
  }
  .wrap { padding: 20px 24px 40px; max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: #6b7280; font-size: 13px; margin: 0 0 20px; }
  .subtitle a { color: #2563eb; text-decoration: none; }
  .subtitle a:hover { text-decoration: underline; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    padding: 14px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
  }
  .seg {
    display: inline-flex;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    overflow: hidden;
  }
  .seg button {
    border: none;
    background: #fff;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    color: #374151;
  }
  .seg button + button { border-left: 1px solid #d1d5db; }
  .seg button.active { background: #2563eb; color: #fff; }
  .controls input[type="date"], .controls select {
    padding: 6px 10px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
    color: #1f2328;
  }
  .controls .spacer { flex: 1; }
  .data-note { font-size: 12px; color: #6b7280; }

  .cards { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .card {
    flex: 1;
    min-width: 140px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 14px;
    background: #fff;
  }
  .card .num { font-size: 22px; font-weight: 600; }
  .card .label { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .card.warn .num { color: #b45309; }
  .card.ok .num { color: #15803d; }
  .card.danger .num { color: #b91c1c; }
  .card.clickable { cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  .card.clickable:hover { border-color: #2563eb; }
  .card.clickable.active { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb inset; }

  h2.section {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6b7280;
    margin: 26px 0 10px;
  }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .badge.in { background: #dcfce7; color: #166534; }
  .badge.out { background: #fee2e2; color: #991b1b; }
  .badge.complete { background: #dcfce7; color: #166534; }
  .badge.missingout { background: #fef3c7; color: #92400e; }
  .badge.missingin { background: #e0e7ff; color: #3730a3; }

  #summaryGrid, #logGrid { font-size: 13px; }
  .gridjs-wrapper { border-radius: 10px !important; }
  .gridjs-th { background: #f8fafc !important; font-size: 12px !important; text-transform: uppercase; letter-spacing: 0.03em; color: #4b5563 !important; }
  .gridjs-td { font-size: 13px !important; }
  .loading { padding: 40px; text-align: center; color: #6b7280; font-size: 13px; }
  .error-box {
    background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    padding: 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css" integrity="sha384-jZvDSsmGB9oGGT/4l9bHXGoAv1OxvG/cFmSo0dZaSqmBgvQTKDBFAMftlXTmMbNW" crossorigin="anonymous">

let mode = "day"; // "day" | "month"

function uniqueSorted(arr) {
  return Array.from(new Set(arr)).sort();
}

function fmtTime12(h, mnt, s) {
  let hh = h % 12; if (hh === 0) hh = 12;
  const ap = h >= 12 ? "PM" : "AM";
  return String(hh).padStart(2, "0") + ":" + String(mnt).padStart(2, "0") + ":" + String(s).padStart(2, "0") + " " + ap;
}

function typeBadge(type) {
  const isIn = type.toLowerCase().includes("in");
  return '<span class="badge ' + (isIn ? "in" : "out") + '">' + type + '</span>';
}

function computeStatusMap(rows) {
  const map = {};
  for (const r of rows) {
    const key = r.name + "|" + r.iso;
    if (!map[key]) map[key] = { ins: 0, outs: 0 };
    if (r.type.toLowerCase().includes("in")) map[key].ins++;
    else map[key].outs++;
  }
  const statusByKey = {};
  for (const key in map) {
    const e = map[key];
    if (e.ins > 0 && e.outs > 0) statusByKey[key] = "complete";
    else if (e.ins > 0 && e.outs === 0) statusByKey[key] = "missingout";
    else if (e.ins === 0 && e.outs > 0) statusByKey[key] = "missingin";
    else statusByKey[key] = "unknown";
  }
  return statusByKey;
}

function statusBadge(status) {
  if (status === "complete") return '<span class="badge complete">Complete</span>';
  if (status === "missingout") return '<span class="badge missingout">Missing clock-out</span>';
  if (status === "missingin") return '<span class="badge missingin">Missing clock-in</span>';
  return '<span class="badge">-</span>';
}

function render() {
  const content = document.getElementById("content");

  let scopeRows, scopeLabel;
  if (mode === "day") {
    const day = document.getElementById("dayPicker").value; // YYYY-MM-DD
    scopeRows = ALL_ROWS.filter(r => r.iso === day);
    scopeLabel = day;
  } else {
    const month = document.getElementById("monthPicker").value; // YYYY-MM
    scopeRows = ALL_ROWS.filter(r => r.monthKey === month);
    scopeLabel = month;
  }

  // Compute completeness status per employee/day BEFORE the type filter narrows things down,
  // so "Missing clock-out" etc. reflects the whole day, not just the filtered type.
  const statusMap = computeStatusMap(scopeRows);

  // Summary cards always reflect the FULL day/month scope, regardless of the type filter,
  // so clicking "Clock Out" to filter the table below doesn't zero out the Clock-ins card.
  const uniqueNames = uniqueSorted(scopeRows.map(r => r.name));
  const inCount = scopeRows.filter(r => r.type.toLowerCase().includes("in")).length;
  const outCount = scopeRows.filter(r => r.type.toLowerCase().includes("out")).length;

  const typeFilter = document.getElementById("typeFilter").value; // "all" | "in" | "out"
  let tableRows = scopeRows;
  if (typeFilter !== "all") {
    tableRows = tableRows.filter(r => r.type.toLowerCase().includes(typeFilter));
  }

  const cardsHtml =
    '<div class="cards">' +
      '<div class="card clickable' + (typeFilter === "all" ? " active" : "") + '" data-type="all"><div class="num">' + uniqueNames.length + '</div><div class="label">People with activity</div></div>' +
      '<div class="card ok clickable' + (typeFilter === "in" ? " active" : "") + '" data-type="in"><div class="num">' + inCount + '</div><div class="label">Clock-ins</div></div>' +
      '<div class="card danger clickable' + (typeFilter === "out" ? " active" : "") + '" data-type="out"><div class="num">' + outCount + '</div><div class="label">Clock-outs</div></div>' +
    '</div>';

  content.innerHTML =
    cardsHtml +
    '<h2 class="section">Clock in / out log - ' + scopeLabel + '</h2>' +
    '<div id="logGrid"></div>';

  content.querySelectorAll('.card[data-type]').forEach(function (el) {
    el.addEventListener('click', function () {
      document.getElementById('typeFilter').value = el.getAttribute('data-type');
      render();
    });
  });

  if (uniqueNames.length === 0) {
    document.getElementById("logGrid").innerHTML = '<div class="loading">No clock-in/out activity recorded for this ' + (mode === "day" ? "day" : "month") + '.</div>';
    return;
  }
  if (tableRows.length === 0) {
    document.getElementById("logGrid").innerHTML = '<div class="loading">No ' + (typeFilter === "in" ? "clock-ins" : "clock-outs") + ' recorded for this ' + (mode === "day" ? "day" : "month") + '.</div>';
    return;
  }

  const logRows = tableRows.slice().sort((a, b) => a.sortKey > b.sortKey ? -1 : a.sortKey < b.sortKey ? 1 : 0);

  new gridjs.Grid({
    columns: [
      { name: "Employee" },
      { name: "Date" },
      { name: "Time" },
      { name: "Type", formatter: (cell) => gridjs.html(typeBadge(cell)) },
      { name: "Schedule" },
      { name: "Day Status", formatter: (cell) => gridjs.html(statusBadge(cell)) }
    ],
    data: logRows.map(r => [r.name, r.dateStr, r.timeStr, r.type, r.schedule, statusMap[r.name + "|" + r.iso] || "unknown"]),
    sort: true,
    search: true,
    pagination: { limit: 100 },
    className: { table: "gridjs-table" }
  }).render(document.getElementById("logGrid"));
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById("modeDay").classList.toggle("active", mode === "day");
  document.getElementById("modeMonth").classList.toggle("active", mode === "month");
  document.getElementById("dayPicker").style.display = mode === "day" ? "" : "none";
  document.getElementById("monthPicker").style.display = mode === "month" ? "" : "none";
  render();
}

function init() {
  document.getElementById("lastUpdated").textContent = "Last updated: " + GENERATED_AT;

  if (ALL_ROWS.length === 0) {
    document.getElementById("content").innerHTML = '<div class="error-box">No rows found in the sheet.</div>';
    return;
  }

  const allDates = uniqueSorted(ALL_ROWS.map(r => r.iso));
  const allMonths = uniqueSorted(ALL_ROWS.map(r => r.monthKey));
  const latestDate = allDates[allDates.length - 1];
  const latestMonth = allMonths[allMonths.length - 1];

  const dayPicker = document.getElementById("dayPicker");
  dayPicker.min = allDates[0];
  dayPicker.max = latestDate;
  dayPicker.value = latestDate;

  const monthPicker = document.getElementById("monthPicker");
  monthPicker.innerHTML = allMonths.slice().reverse().map(m => '<option value="' + m + '">' + m + '</option>').join("");
  monthPicker.value = latestMonth;

  document.getElementById("dataNote").textContent = "Data covers " + allDates[0] + " through " + latestDate;

  document.getElementById("modeDay").addEventListener("click", () => setMode("day"));
  document.getElementById("modeMonth").addEventListener("click", () => setMode("month"));
  dayPicker.addEventListener("change", render);
  monthPicker.addEventListener("change", render);
  document.getElementById("typeFilter").addEventListener("change", render);

  render();
}

init();
</script>
