<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock In / Out Report</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css" integrity="sha384-jZvDSsmGB9oGGT/4l9bHXGoAv1OxvG/cFmSo0dZaSqmBgvQTKDBFAMftlXTmMbNW" crossorigin="anonymous">

<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e3e6ea;
    --text: #1f2430;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --green-bg: #e6f7ed;
    --green-text: #10763f;
    --red-bg: #fdecec;
    --red-text: #b3261e;
    --amber-bg: #fef3d6;
    --amber-text: #9a6a00;
    --indigo-bg: #e8e6fd;
    --indigo-text: #4338ca;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin: 0 0 20px 0; }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .toggle-group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle-btn {
    border: none;
    background: var(--card-bg);
    color: var(--text);
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .toggle-btn.active { background: var(--accent); color: #fff; }
  select, input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    background: #fff;
    color: var(--text);
  }
  .data-note { margin-left: auto; font-size: 12px; color: var(--text-muted); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .card-value { font-size: 26px; font-weight: 700; }

  .table-title { font-size: 15px; font-weight: 600; margin: 0 0 10px 0; }
  .table-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-green { background: var(--green-bg); color: var(--green-text); }
  .badge-red { background: var(--red-bg); color: var(--red-text); }
  .badge-amber { background: var(--amber-bg); color: var(--amber-text); }
  .badge-indigo { background: var(--indigo-bg); color: var(--indigo-text); }

  .gridjs-wrapper { border-radius: 8px; }
  .gridjs-table { font-size: 13px; }
  .gridjs-th { background: #fafbfc; font-weight: 600; }
  .gridjs-search-input { border-radius: 6px; }
  .gridjs-pagination .gridjs-pages button { border-radius: 6px; }
</style>
</head>
<body>
<div class="container">
  <h1>Clock In / Out Report</h1>
  <p class="subtitle">Attendance data from Slack clock-in/out bot. Last updated: 2026-07-28 20:22 UTC UTC</p>

  <div class="controls">
    <div class="toggle-group">
      <button class="toggle-btn active" id="dayBtn">Day</button>
      <button class="toggle-btn" id="monthBtn">Month</button>
    </div>
    <input type="date" id="dayPicker">
    <select id="monthPicker" style="display:none;"></select>
    <select id="typeFilter">
      <option value="all">All types</option>
      <option value="Clock In">Clock In</option>
      <option value="Clock Out">Clock Out</option>
    </select>
    <span class="data-note" id="dataNote"></span>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">People with activity</div>
      <div class="card-value" id="cardPeople">0</div>
    </div>
    <div class="card">
      <div class="card-label">Clock-ins</div>
      <div class="card-value" id="cardIns">0</div>
    </div>
    <div class="card">
      <div class="card-label">Clock-outs</div>
      <div class="card-value" id="cardOuts">0</div>
    </div>
  </div>

  <div class="table-card">
    <p class="table-title" id="tableTitle">Clock in / out log</p>
    <div id="grid"></div>
  </div>
</div>

function pad(n) { return String(n).padStart(2, '0'); }

function fmtDateLabel(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
}

function fmtMonthLabel(monthKey) {
  const [y, m] = monthKey.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, 1));
  return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', timeZone: 'UTC' });
}

const allDates = Array.from(new Set(ALL_ROWS.map(r => r.iso))).sort();
const allMonths = Array.from(new Set(ALL_ROWS.map(r => r.monthKey))).sort();
const minDate = allDates[0];
const maxDate = allDates[allDates.length - 1];

document.getElementById('dataNote').textContent = allDates.length
  ? `Data covers ${fmtDateLabel(minDate)} – ${fmtDateLabel(maxDate)}`
  : 'No data available';

let mode = 'day';
let grid = null;

const dayPicker = document.getElementById('dayPicker');
const monthPicker = document.getElementById('monthPicker');
const dayBtn = document.getElementById('dayBtn');
const monthBtn = document.getElementById('monthBtn');
const typeFilter = document.getElementById('typeFilter');

dayPicker.value = maxDate;
dayPicker.min = minDate;
dayPicker.max = maxDate;

allMonths.forEach(mk => {
  const opt = document.createElement('option');
  opt.value = mk;
  opt.textContent = fmtMonthLabel(mk);
  monthPicker.appendChild(opt);
});
monthPicker.value = allMonths[allMonths.length - 1];

dayBtn.addEventListener('click', () => {
  mode = 'day';
  dayBtn.classList.add('active');
  monthBtn.classList.remove('active');
  dayPicker.style.display = '';
  monthPicker.style.display = 'none';
  render();
});
monthBtn.addEventListener('click', () => {
  mode = 'month';
  monthBtn.classList.add('active');
  dayBtn.classList.remove('active');
  dayPicker.style.display = 'none';
  monthPicker.style.display = '';
  render();
});
dayPicker.addEventListener('change', render);
monthPicker.addEventListener('change', render);
typeFilter.addEventListener('change', render);

function getScopeRows() {
  if (mode === 'day') {
    const d = dayPicker.value;
    return ALL_ROWS.filter(r => r.iso === d);
  } else {
    const mk = monthPicker.value;
    return ALL_ROWS.filter(r => r.monthKey === mk);
  }
}

function computeStatusMap(scopeRows) {
  // key: name|iso -> {in: bool, out: bool}
  const map = {};
  scopeRows.forEach(r => {
    const key = r.name + '|' + r.iso;
    if (!map[key]) map[key] = { in: false, out: false };
    if (r.type === 'Clock In') map[key].in = true;
    else if (r.type === 'Clock Out') map[key].out = true;
  });
  return map;
}

function statusBadge(hasIn, hasOut) {
  if (hasIn && hasOut) return '<span class="badge badge-green">Complete</span>';
  if (hasIn && !hasOut) return '<span class="badge badge-amber">Missing clock-out</span>';
  if (!hasIn && hasOut) return '<span class="badge badge-indigo">Missing clock-in</span>';
  return '';
}

function typeBadge(type) {
  if (type === 'Clock In') return '<span class="badge badge-green">Clock In</span>';
  if (type === 'Clock Out') return '<span class="badge badge-red">Clock Out</span>';
  return type;
}

function render() {
  const scopeRows = getScopeRows();
  const statusMap = computeStatusMap(scopeRows);

  const typeVal = typeFilter.value;
  const filteredRows = typeVal === 'all' ? scopeRows : scopeRows.filter(r => r.type === typeVal);

  const peopleSet = new Set(filteredRows.map(r => r.name));
  const insCount = filteredRows.filter(r => r.type === 'Clock In').length;
  const outsCount = filteredRows.filter(r => r.type === 'Clock Out').length;

  document.getElementById('cardPeople').textContent = peopleSet.size;
  document.getElementById('cardIns').textContent = insCount;
  document.getElementById('cardOuts').textContent = outsCount;

  let scopeLabel;
  if (mode === 'day') {
    scopeLabel = fmtDateLabel(dayPicker.value);
  } else {
    scopeLabel = fmtMonthLabel(monthPicker.value);
  }
  document.getElementById('tableTitle').textContent = `Clock in / out log - ${scopeLabel}`;

  const sorted = filteredRows.slice().sort((a, b) => a.sortKey < b.sortKey ? 1 : -1);

  const gridData = sorted.map(r => {
    const st = statusMap[r.name + '|' + r.iso] || { in: false, out: false };
    return [
      r.name,
      r.dateStr,
      r.timeStr,
      { type: r.type, html: typeBadge(r.type) },
      r.schedule,
      { html: statusBadge(st.in, st.out) }
    ];
  });

  const columns = [
    { name: 'Employee' },
    { name: 'Date' },
    { name: 'Time' },
    {
      name: 'Type',
      formatter: (cell) => gridjs.html(cell.html),
      sort: {
        compare: (a, b) => a.type === b.type ? 0 : (a.type > b.type ? 1 : -1)
      }
    },
    { name: 'Schedule' },
    {
      name: 'Day Status',
      formatter: (cell) => gridjs.html(cell.html)
    }
  ];

  if (grid) {
    grid.destroy();
  }
  grid = new gridjs.Grid({
    columns: columns,
    data: gridData,
    sort: true,
    search: true,
    pagination: { limit: 100 },
    className: { table: 'gridjs-table' }
  }).render(document.getElementById('grid'));
}

render();
</script>
